name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

defaults:
  run:
    working-directory: build-2-custom-crm

jobs:
  build-and-check:
    name: build-and-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: build-2-custom-crm/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        # Runs Next's own TypeScript check — a standalone `tsc --noEmit`
        # step would fail here since LayoutProps/PageProps are generated
        # by this same build step, not present on a fresh checkout.
        run: npm run build
